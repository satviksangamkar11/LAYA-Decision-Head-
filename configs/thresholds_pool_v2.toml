# Pool v2 quality thresholds (versioned, must be written BEFORE any run)
# Generated by gates_v2.py with corrected semantics
# Date: 2026-10-04

[gold_findability]
description = """
Text-only classifier (TF-IDF + logistic on option text only, no state) must NOT find gold.
PASS semantics: baseline top-1 on gold <= chance + margin.
Means: gold is distinguishable from other options by text alone, which is BAD.
Earlier rule (top-1 > 0.60) was inverted; this is the correct gate.
"""

max_top1_on_gold = "chance + 0.15"
min_chance = 0.10
margin = 0.15
reason = "Gold must not be easily found by text-only classifier. Measured per source, per split (train/cal), per option type (gold, real_run_T1/T2/T3, qwen_proposal)."

[style_separability]
description = """
Text-only classifier must NOT separate qwen_proposal from gold/real_run options by style.
FAIL if AUROC > 0.70 (Qwen proposals are stylistically distinct from real options).
This would indicate a NEW shortcut: proposals are from one source (Qwen),
gold/real are from others. The model should learn based on correctness,
not authorship or generation style.
"""

max_auroc_qwen_vs_others = 0.70
reason = "Proposals and gold/real options must be indistinguishable by style alone. Measured per source, per split."

[split_counts]
description = "Train/cal/test must be disjoint (no decision_id overlap). Checked by split manifest."
train_min = 1000
cal_min = 200
test_min = 200

[decision_counts]
description = "Total decisions in pool, per-source breakdown."
total_min = 40000
nebius_min = 10000
swesmith_min = 10000
fable5_min = 10000

[comment]
reason = "Gate 1 fails loudly if baseline text classifier finds gold. Gate 2 fails if proposals are stylistically distinct. Both require NO shortcut (measured FAILS the run if shortcut present)."
date_written = "2026-10-04"
status = "READY FOR PRODUCTION"
